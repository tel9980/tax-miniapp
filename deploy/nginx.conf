# 税收政策 API —— nginx 站点配置
# 放到 /etc/nginx/sites-available/tax-api，然后 ln -s 到 sites-enabled
# certbot 会自动往这个文件里插入 443 / 证书相关行，不要手写 ssl_certificate

server {
    listen 80;
    server_name api.1211663.xyz;

    # 小程序只发 GET，10m 足够
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/refresh 要现场抓 15 个官方源，约 20~30 秒，别让 nginx 提前掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 健康检查（可选，方便监控）
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/api/policies;
        proxy_set_header Host $host;
        access_log off;
    }
}
