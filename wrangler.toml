name = "tax-miniapp"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Worker 静态资源：web/ 由 Worker 通过 env.ASSETS 服务（首页走 Worker 逻辑，静态文件自动回源）
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 自定义域名：te.1211.cc.cd
[[routes]]
pattern = "te.1211.cc.cd"
custom_domain = true

[observability]
enabled = true
