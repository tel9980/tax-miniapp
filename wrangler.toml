name = "tax-miniapp"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Worker 静态资源：web/ 由 Worker 通过 env.ASSETS 服务（首页走 Worker 逻辑，静态文件自动回源）
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 自定义域名：te.1211.cc.cd
[[routes]]
pattern = "te.1211.cc.cd"
custom_domain = true

# 政策数据持久化到 KV（跨边缘节点共享、不会被驱逐）
[[kv_namespaces]]
binding = "POLICIES"
id = "853d9ddc1d7844169f13d085af2290a2"

# 定时抓取：每天 UTC 01:00（北京时间 09:00）自动抓取最新政策写 KV
[triggers]
crons = ["0 1 * * *"]

[observability]
enabled = true
